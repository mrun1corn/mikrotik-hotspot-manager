<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="-1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Hotspot Portal > Logged Out</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style type="text/css">
        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --panel-bg: #1e293b;
            --panel-inner: #0f172a;
            --card-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.35);
            --bkash-pink: #e2136e;
            --bkash-glow: rgba(226, 19, 110, 0.35);
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --panel-bg: #ffffff;
            --panel-inner: #f8fafc;
            --card-border: rgba(0, 0, 0, 0.08);
            --primary: #2563eb;
            --primary-glow: rgba(37, 99, 235, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            transition: background-color 0.3s ease, color 0.3s ease;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.18) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(148, 163, 184, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero {
            text-align: center;
            padding: 4px 0;
        }

        .icon-badge {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #64748b, #475569);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            font-size: 30px;
        }

        .hero h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .hero p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .card {
            background: var(--panel-bg);
            border-radius: 16px;
            border: 1px solid var(--card-border);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.25);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-item {
            background: var(--panel-inner);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            text-align: left;
        }

        .stat-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
        }

        .actions-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 4px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 20px var(--primary-glow);
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            padding: 13px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .theme-toggle-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--panel-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>
<body>
    <button class="theme-toggle-btn" id="themeBtn" title="Toggle Theme">💡</button>

    <div class="container">
        <div class="hero">
            <div class="icon-badge">👋</div>
            <h1>Logged Out</h1>
            <p>You have successfully disconnected from the hotspot session.</p>
        </div>

        <div class="card">
            <!-- Final Session Stats -->
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">User / IP</span>
                    <span class="stat-value">$(username)</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Total Uptime</span>
                    <span class="stat-value">$(uptime)</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Downloaded</span>
                    <span class="stat-value">$(bytes-out-nice)</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Uploaded</span>
                    <span class="stat-value">$(bytes-in-nice)</span>
                </div>
            </div>

            <div class="actions-group">
                <a href="$(link-login)" class="btn-primary">
                    <span>⚡</span>
                    <span>Log In Again</span>
                </a>

                <a href="https://mikrotik-hotspot-manager-one.vercel.app/register" class="btn-secondary">
                    <span>💳</span>
                    <span>Buy New Wi-Fi Package</span>
                </a>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        // Theme Toggle
        const themeBtn = document.getElementById('themeBtn');
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light-mode') {
            document.body.classList.add('light-mode');
            themeBtn.innerText = '🌙';
        }

        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            themeBtn.innerText = isLight ? '🌙' : '💡';
            localStorage.setItem('theme', isLight ? 'light-mode' : 'dark-mode');
        });
    </script>
</body>
</html>
