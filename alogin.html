<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="-1" />
    $(if refresh-timeout)
    <meta http-equiv="refresh" content="$(refresh-timeout-secs)">
    $(endif)
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Hotspot Portal > Redirecting</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style type="text/css">
        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --panel-bg: #1e293b;
            --card-border: rgba(255, 255, 255, 0.1);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.35);
            --primary: #3b82f6;
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --panel-bg: #ffffff;
            --card-border: rgba(0, 0, 0, 0.08);
            --primary: #2563eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            transition: background-color 0.3s ease, color 0.3s ease;
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            text-align: center;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--panel-bg);
            border-radius: 16px;
            border: 1px solid var(--card-border);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.25);
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .success-badge {
            width: 72px;
            height: 72px;
            background: var(--success);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px var(--success-glow);
            font-size: 34px;
            color: #fff;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .redirect-btn {
            background: var(--primary);
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            padding: 12px 20px;
            border-radius: 10px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
        }

        .theme-toggle-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--panel-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
        }
    </style>
    <script language="JavaScript">
    <!--
        function startClock() {
            $(if popup == 'true')
            open('$(link-status)', 'hotspot_status', 'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=290,height=200');
            $(endif)
            location.href = unescape('$(link-redirect-esc)');
        }
    //-->
    </script>
</head>
<body onLoad="startClock()">
    <button class="theme-toggle-btn" id="themeBtn" title="Toggle Theme">💡</button>

    <div class="container">
        <div class="card">
            <div class="success-badge">✅</div>
            <h1>Connected Successfully!</h1>
            <p>You are now logged in and granted full internet access.</p>
            <p>Redirecting you to your destination...</p>
            <a href="$(link-redirect)" class="redirect-btn">Click here if not redirected</a>
        </div>
    </div>

    <script type="text/javascript">
        const themeBtn = document.getElementById('themeBtn');
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light-mode') {
            document.body.classList.add('light-mode');
            themeBtn.innerText = '🌙';
        }

        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            themeBtn.innerText = isLight ? '🌙' : '💡';
            localStorage.setItem('theme', isLight ? 'light-mode' : 'dark-mode');
        });
    </script>
</body>
</html>
